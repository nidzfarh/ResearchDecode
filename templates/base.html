<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        {% endblock %}
    </title>
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}?v=3">

</head>

<body>
    <button id="theme-toggle"
            class="theme-toggle">
        🌙
    </button>
    <div class="app-layout"><aside class="sidebar">
            <div class="logo">ResearchDecode</div>
            <div class="sidebar-section">
                <div class="sidebar-label">Workspace</div>
                <a href="/" class="nav-item active">Upload Paper</a> </div>

            <div class="sidebar-section">
                <div class="sidebar-label">Recent Analyses</div>
                <input type="text"
                       id="search-analysis"
                       placeholder="Search analyses..."
                       class="search-input">
                {% for analysis in analyses %}
                <div class="history-wrapper">

                    <a href="/analysis/{{ analysis.id }}"
                       class="history-item">
                        {{ analysis.filename }}</a>

                    <a href="/delete/{{ analysis.id }}"
                       class="delete-btn">✕</a>

                </div>
                {% endfor %}
            </div>
        </aside>
        <main class="main-content">
            {% block content %}
            {% endblock %}
        </main>
    </div>
    <div class="loading-overlay"
         id="loading-overlay">
        <div class="loader-wrapper">
            <div class="loader-spinner"></div>
            <div class="loader-text">
                Analyzing Research Paper...</div>
        </div>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const form =document.getElementById("upload-form");
            if(form){
                form.addEventListener("submit", () => {
                    const overlay =
                        document.getElementById("loading-overlay");
                    if(overlay){overlay.classList.add("show");}});
            }
            const input =document.getElementById("pdf-input");
            const selectedFile =document.getElementById("selected-file");

            if(input && selectedFile){
                input.addEventListener("change", () => {
                    if(input.files.length > 0){
                        selectedFile.textContent =
                            input.files[0].name;
                    }
                });}
            const toggles =document.querySelectorAll(".collapse-toggle");

            toggles.forEach(toggle => {
                toggle.addEventListener("click", () => {
                    const block =toggle.closest(".result-block");
                    if(block){

                        block.classList.toggle("open");
                    }
                });
            });
            const themeToggle =document.getElementById("theme-toggle");
            if(localStorage.getItem("theme") === "light"){
                document.documentElement.classList.add("light-mode");
                themeToggle.innerHTML = "☀️";
            }
            if(themeToggle){
                themeToggle.addEventListener("click", () => {
                    document.documentElement.classList.toggle("light-mode");
                    if(document.documentElement.classList.contains("light-mode")){
                        localStorage.setItem("theme", "light");
                        themeToggle.innerHTML = "☀️";
                    }else{
                        localStorage.setItem("theme", "dark");
                        themeToggle.innerHTML = "🌙";
                    }
                });
            }
            const searchInput =document.getElementById("search-analysis");

            if(searchInput){
                searchInput.addEventListener("keyup", () => {
                    const value =searchInput.value.toLowerCase();
                    const items =document.querySelectorAll(".history-wrapper");
                    items.forEach(item => {
                        const text =item.textContent.toLowerCase();
                        item.style.display =text.includes(value)? "flex": "none";});
                });}});
    </script>
</body>
</html>
